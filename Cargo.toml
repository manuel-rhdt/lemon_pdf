[package]
name = "lemon_pdf"
version = "0.1.0"
authors = ["Manuel Reinhardt <manuel.rhdt@gmail.com>"]
edition = "2018"

[dependencies]
derive_more = { version = "2", features = ["display", "from"] }
flate2 = "1"
byteorder = "1"
lemon_pdf_derive = { path = "./lemon_pdf_derive" }
bitflags = "2"
log = "0.4.8"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
glob = "0.3.0"
quote = "1"
proc-macro2 = "1"
csv = "1"
Inflector = "0.11.4"

[dev-dependencies]
encoding_rs = "0.8.22"
lopdf = "0.47"
